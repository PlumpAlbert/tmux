set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set-window-option -g mode-keys vi
set-option -g status-keys vi
set -g mouse on

set-option -g set-titles on
set-option -g set-titles-string '#S:#I.#P #W'
set-window-option -g automatic-rename on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g history-limit 200000
set -g detach-on-destroy off

set -s escape-time 1
set -g xterm-keys on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB,xterm-ghostty:RGB,ghostty:RGB'
set -ga terminal-overrides ',xterm-256color:Tc,screen-256color:Tc,tmux-256color:Tc,xterm-ghostty:Tc,ghostty:Tc'
set -g focus-events on

# Better modified-key reporting for modern terminal UIs such as Neovim.
%if '#{>=:#{version},3.2}'
set -g extended-keys on
%endif

# Let nested terminal UIs pass escape sequences such as OSC52 through tmux.
%if '#{>=:#{version},3.3}'
set -g allow-passthrough on
%endif

# Copy through the SSH connection using the client terminal's OSC 52 support.
set -s set-clipboard external

source-file ~/.config/tmux/mappings.conf
source-file ~/.config/tmux/variant.conf
source-file ~/.config/tmux/ui.conf
source-file ~/.config/tmux/ssh.conf

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'pschmitt/tmux-ssh-split'

run '~/.config/tmux/plugins/tpm/tpm'
